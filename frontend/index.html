<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinSight — Personal Finance Intelligence</title>
    <meta name="application-name" content="FinSight" />
    <meta name="description" content="FinSight — Understand Your Spending. Make Smarter Financial Decisions. Track expenses, budgets and savings goals with evidence-based financial insights." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinSight — Personal Finance Intelligence" />
    <meta property="og:description" content="Understand Your Spending. Make Smarter Financial Decisions." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Dark theme by default; light only when chosen (or "System" on a light OS).
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && !(t === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
