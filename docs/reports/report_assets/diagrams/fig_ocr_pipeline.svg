<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480"><defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ars" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="args" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arxs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="90" width="250" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="165.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">1. Upload</text><text x="165.0" y="149.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">local: multipart POST</text><text x="165.0" y="168.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">AWS: presigned POST to S3</text><rect x="330" y="90" width="250" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="455.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">2. Validate</text><text x="455.0" y="149.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">≤ 5 MB, magic bytes</text><text x="455.0" y="168.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">JPEG/PNG/WebP, ≤ 40 MP</text><path d="M290,145 L330,145" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="620" y="90" width="250" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="745.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">3. Pre-process</text><text x="745.0" y="149.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">EXIF rotate, grayscale,</text><text x="745.0" y="168.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">scale, autocontrast, sharpen</text><path d="M580,145 L620,145" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="910" y="90" width="250" height="110" rx="10" fill="#e6f6ef" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1035.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">4. Tesseract OCR</text><text x="1035.0" y="149.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">--oem 3 --psm 4</text><text x="1035.0" y="168.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">per-line confidence</text><path d="M870,145 L910,145" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1200" y="90" width="250" height="110" rx="10" fill="#e6f6ef" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1325.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">5. Rule-based parser</text><text x="1325.0" y="149.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">total, date, merchant, tax,</text><text x="1325.0" y="168.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">currency, items, category</text><path d="M1160,145 L1200,145" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1200" y="270" width="270" height="110" rx="10" fill="#fffbea" stroke="#d4a72c" stroke-width="1.6" filter="url(#sh)"/><text x="1335.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">6. Human review</text><text x="1335.0" y="329.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">every field editable;</text><text x="1335.0" y="348.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">confidence + warnings shown</text><path d="M1325,200 L1325,270" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="840" y="270" width="300" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="990.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">7. Confirm</text><text x="990.0" y="329.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">expense created, receipt linked;</text><text x="990.0" y="348.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">image kept private</text><path d="M1200,325 L1140,325" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="420" y="270" width="360" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="600.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="700" fill="#1d2421" text-anchor="middle">Total selection rules</text><text x="600.0" y="319.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">grand total &gt; net/amount payable &gt; total;</text><text x="600.0" y="338.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">excludes subtotal, tax, change; cross-check</text><text x="600.0" y="357.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">subtotal + tax or sum of line items</text><rect x="40" y="270" width="330" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="205.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="700" fill="#1d2421" text-anchor="middle">Failure handling</text><text x="205.0" y="319.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">unknown fields left blank + warning;</text><text x="205.0" y="338.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">currency mismatch flagged;</text><text x="205.0" y="357.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="middle">OCR unavailable → manual entry</text><text x="750" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle" font-style="italic">No paid OCR service is used; extraction is an estimate and nothing is saved until the user confirms.</text></svg>