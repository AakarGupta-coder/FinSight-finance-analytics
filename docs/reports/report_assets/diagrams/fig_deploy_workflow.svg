="#5b6560" text-anchor="middle">sam validate --lint</text><rect x="760" y="95" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="865.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">4. sam build</text><text x="865.0" y="164.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">zip functions (python3.13)</text><text x="865.0" y="183.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">receipts image (Docker)</text><rect x="1000" y="95" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1105.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">5. Package</text><text x="1105.0" y="164.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">artifacts → SAM S3 bucket</text><text x="1105.0" y="183.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">image → SAM-managed ECR</text><rect x="1240" y="95" width="210" height="130" rx="10" fill="#e6f6ef" stroke="#b45309" stroke-width="1.6" filter="url(#sh)"/><text x="1345.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">6. Change-set review</text><text x="1345.0" y="164.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">sam deploy</text><text x="1345.0" y="183.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">confirm_changeset = true</text><rect x="1240" y="340" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1345.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">7. Create / update stack</text><text x="1345.0" y="409.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">63 resources created</text><text x="1345.0" y="428.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">then 3 code-only updates</text><rect x="1000" y="340" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1105.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">8. Capture outputs</text><text x="1105.0" y="409.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">WebUrl = ApiUrl (one origin)</text><text x="1105.0" y="428.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">table, bucket, pool ids</text><rect x="760" y="340" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="865.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">9. Live API tests</text><text x="865.0" y="409.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">infra/live_test.py</text><text x="865.0" y="428.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">64/64 checks passed</text><rect x="520" y="340" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="625.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">10. Live browser tests</text><text x="625.0" y="409.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">headless Chrome on WebUrl</text><text x="625.0" y="428.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">27/27 checks passed</text><rect x="280" y="340" width="210" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="385.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">11. Monitor</text><text x="385.0" y="409.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">CloudWatch logs + 5xx alarm</text><text x="385.0" y="428.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">(alarm state OK)</text><path d="M250,160 L280,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M490,160 L520,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M730,160 L760,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M970,160 L1000,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M1210,160 L1240,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M1345,225 L1345,340" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M1240,405 L1210,405" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M1000,405 L970,405" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M760,405 L730,405" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M520,405 L490,405" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><text x="40" y="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="600" fill="#92400e" text-anchor="start">Review gate: no AWS resource is created until the owner approves the CloudFormation change set (step 6).</text><text x="40" y="548" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="400" fill="#5b6560" text-anchor="start">Attempts 1–2 rolled back (CloudFront refused for the new account); attempt 3 used FrontendHosting=apigateway and completed.</text><text x="40" y="576" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="400" fill="#5b6560" text-anchor="start">Rollback: sam delete removes stack resources; the DynamoDB table and receipts bucket are retained by design (DeletionPolicy: Retain).</text></svg>