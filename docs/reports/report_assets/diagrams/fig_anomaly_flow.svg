</defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="250" y="70" width="340" height="64" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="420.0" y="96.6875" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Expense created / edited</text><text x="420.0" y="116.0625" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">load 365-day history of this user</text><polygon points="420,160.0 570.0,210 420,260.0 270.0,210" fill="#fffbea" stroke="#d4a72c" stroke-width="1.6"/><text x="420" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="600" fill="#1d2421" text-anchor="middle">≥ 5 earlier transactions</text><text x="420" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="600" fill="#1d2421" text-anchor="middle">in the same category?</text><path d="M420,134 L420,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="250" y="300" width="340" height="70" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="420.0" y="329.6875" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Compute category median m</text><text x="420.0" y="349.0625" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">and MAD (median absolute deviation)</text><path d="M420,260 L420,300" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="432" y="268.775" width="34.218" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="438" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="start">yes</text><polygon points="420,395.0 530.0,440 420,485.0 310.0,440" fill="#fffbea" stroke="#d4a72c" stroke-width="1.6"/><text x="420" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="600" fill="#1d2421" text-anchor="middle">MAD = 0 ?</text><path d="M420,370 L420,395" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="90" y="510" width="280" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="230.0" y="544.6875" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Ratio test only</text><text x="230.0" y="564.0625" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">x ≥ r × m</text><rect x="470" y="510" width="300" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="620.0" y="535.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Modified z-score</text><text x="620.0" y="554.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">z = 0.6745 (x − m) / MAD</text><text x="620.0" y="573.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">flag if z ≥ t AND x ≥ r × m</text><path d="M310,440 L230,440 L230,510" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="252.891" y="415.775" width="34.218" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="270" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">yes</text><path d="M530,440 L620,440 L620,510" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="561.594" y="415.775" width="26.812" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="575" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">no</text><rect x="870" y="160" width="330" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1035.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Thin category history</text><text x="1035.0" y="214.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">needs ≥ 10 transactions overall;</text><text x="1035.0" y="233.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">x ≥ max(5 × overall median, 1.5 × p95)</text><path d="M570,210 L870,210" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="686.594" y="185.775" width="26.812" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="700" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">no</text><polygon points="420,635.0 550.0,680 420,725.0 290.0,680" fill="#fffbea" stroke="#d4a72c" stroke-width="1.6"/><text x="420" y="684.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="600" fill="#1d2421" text-anchor="middle">Rule satisfied?</text><path d="M230,590 L230,680 L290,680" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M620,590 L620,680 L550,680" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><path d="M1035,260 L1035,680 L550,680" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="795.316" y="543.775" width="219.36800000000002" height="40.45" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="905" y="560.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">if no similar amount already</text><text x="905" y="577.225" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">in category (avoids rent)</text><rect x="220" y="770" width="400" height="80" rx="10" fill="#e6f6ef" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="420.0" y="795.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Create alert (if dedup key is new)</text><text x="420.0" y="814.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">rule, severity, reason, comparison values</text><text x="420.0" y="833.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">status = open → user reviews</text><path d="M420,725 L420,770" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="432" y="735.775" width="34.218" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="438" y="752.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="start">yes</text><rect x="1180" y="330" width="290" height="300" rx="10" fill="#fffbea" stroke="#d4a72c" stroke-width="1.6" filter="url(#sh)"/><text x="1192" y="380.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.9" font-weight="700" fill="#1d2421" text-anchor="start">Additional rules</text><text x="1192" y="399.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">Possible duplicate: same amount +</text><text x="1192" y="418.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">merchant/description within 1 day</text><text x="1192" y="437.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">Repeated similar: ≥ 3 at one</text><text x="1192" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">merchant on the same day</text><text x="1192" y="474.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">Category spike: month total ≥</text><text x="1192" y="493.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">s × average of earlier months</text><text x="1192" y="512.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start"></text><text x="1192" y="531.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">Presets (t, r, s):</text><text x="1192" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">conservative 5.0, 3.0, 2.25</text><text x="1192" y="568.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">balanced 3.5, 2.5, 1.75</text><text x="1192" y="587.5999999999999" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#5b6560" text-anchor="start">sensitive 3.0, 2.0, 1.5</text><text x="40" y="885" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="start" font-style="italic">An alert means &#x27;worth a look&#x27;. Detection never modifies transactions and does not establish fraud.</text></svg>