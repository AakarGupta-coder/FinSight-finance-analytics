" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">UI primitives &amp; charts</text><text x="747.0" y="184.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">cards, dialogs, forms,</text><text x="747.0" y="203.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">trend, donut, bars</text><rect x="898" y="120" width="250" height="120" rx="10" fill="#e6f6ef" stroke="#7cc8a8" stroke-width="1.6" filter="url(#sh)"/><text x="1023.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">lib/api.ts</text><text x="1023.0" y="184.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">single API client,</text><text x="1023.0" y="203.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">bearer token, errors</text><rect x="1174" y="120" width="250" height="120" rx="10" fill="#e6f6ef" stroke="#7cc8a8" stroke-width="1.6" filter="url(#sh)"/><text x="1299.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">lib/auth.tsx</text><text x="1299.0" y="184.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">local JWT or Cognito</text><text x="1299.0" y="203.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">(sessionStorage)</text><path d="M750,270 L750,330" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="764" y="286.775" width="411.92400000000004" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="770" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="start">HTTPS · JSON · /api/v1 · Authorization: Bearer &lt;token&gt;</text><rect x="40" y="345" width="1420" height="300" rx="14" fill="none" stroke="#c2620a" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="54" y="334" width="493.7" height="22" rx="6" fill="#ffffff"/><text x="63" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="700" fill="#c2620a" text-anchor="start">Application layer — Python FastAPI (routes → services → repository)</text><rect x="70" y="385" width="300" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="220.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">API routes (9 groups)</text><text x="220.0" y="439.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">auth, expenses, budgets, analytics,</text><text x="220.0" y="458.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">anomalies, receipts, planning, …</text><rect x="400" y="385" width="300" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="550.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Security dependencies</text><text x="550.0" y="439.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">token verification → user id,</text><text x="550.0" y="458.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">strict Pydantic validation</text><rect x="730" y="385" width="700" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1080.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Domain services (business logic, storage-independent)</text><text x="1080.0" y="439.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">budgets · analytics · insights · recurring · anomalies · receipts (OCR + parser)</text><text x="1080.0" y="458.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">simulator · goals · assistant (rule-based NLU) · demo data · preferences</text><rect x="70" y="515" width="630" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="385.0" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Repository interface (app/repositories/base.py)</text><text x="385.0" y="569.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">user-scoped CRUD, date-range queries, conditional inserts,</text><text x="385.0" y="588.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">delete-all — identical behaviour for both back-ends</text><rect x="730" y="515" width="330" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="895.0" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Receipt storage interface</text><text x="895.0" y="569.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">local private folder or</text><text x="895.0" y="588.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">private S3 + presigned URLs</text><rect x="1090" y="515" width="340" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="1260.0" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Tesseract OCR 5</text><text x="1260.0" y="569.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">native binary via pytesseract</text><text x="1260.0" y="588.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">(--oem 3 --psm 4)</text><rect x="40" y="680" width="690" height="190" rx="14" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="54" y="669" width="273.6" height="22" rx="6" fill="#ffffff"/><text x="63" y="685" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="700" fill="#475569" text-anchor="start">Local profile (implemented &amp; tested)</text><rect x="70" y="720" width="300" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="220.0" y="765.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">SQLite (WAL)</text><text x="220.0" y="784.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">backend/data/finance.db</text><text x="220.0" y="803.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">per-user WHERE user_id = ?</text><rect x="400" y="720" width="300" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="550.0" y="765.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Local auth + files</text><text x="550.0" y="784.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">scrypt + HS256 JWT</text><text x="550.0" y="803.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">private receipts directory</text><rect x="770" y="680" width="690" height="190" rx="14" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="784" y="669" width="365.9" height="22" rx="6" fill="#ffffff"/><text x="793" y="685" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="700" fill="#059669" text-anchor="start">AWS profile (deployed, tested with moto and live)</text><rect x="800" y="720" width="300" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="950.0" y="765.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Amazon DynamoDB</text><text x="950.0" y="784.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">single table, PK USER#&lt;uid&gt;</text><text x="950.0" y="803.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">GSI1 for expense dates</text><rect x="1130" y="720" width="300" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1280.0" y="765.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#1d2421" text-anchor="middle">Cognito + private S3</text><text x="1280.0" y="784.375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">RS256 access tokens (JWKS)</text><text x="1280.0" y="803.75" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="middle">presigned POST / GET</text><path d="M385,615 L385,680" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="389" y="635.775" width="330.458" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="395" y="652.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="start">DATA_BACKEND=sqlite · RECEIPT_STORAGE=local</text><path d="M895,615 L895,680" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="899" y="635.775" width="323.05199999999996" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="905" y="652.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="start">DATA_BACKEND=dynamodb · RECEIPT_STORAGE=s3</text></svg>