</defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="70" width="240" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="130.0" y="99.55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.1" font-weight="700" fill="#1d2421" text-anchor="middle">Browser (SPA)</text><line x1="130" y1="120" x2="130" y2="640" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="310" y="70" width="240" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="430.0" y="99.55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.1" font-weight="700" fill="#1d2421" text-anchor="middle">Amazon Cognito</text><line x1="430" y1="120" x2="430" y2="640" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="630" y="70" width="240" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="750.0" y="99.55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.1" font-weight="700" fill="#1d2421" text-anchor="middle">API Gateway (JWT authorizer)</text><line x1="750" y1="120" x2="750" y2="640" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="950" y="70" width="240" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1070.0" y="99.55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.1" font-weight="700" fill="#1d2421" text-anchor="middle">Lambda (FastAPI)</text><line x1="1070" y1="120" x2="1070" y2="640" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="1240" y="70" width="240" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)"/><text x="1360.0" y="99.55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.1" font-weight="700" fill="#1d2421" text-anchor="middle">DynamoDB</text><line x1="1360" y1="120" x2="1360" y2="640" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M130,160 L430,160" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="88.85" y="135.775" width="382.3" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="280.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">InitiateAuth (USER_PASSWORD_AUTH, email, password)</text><path d="M430,210 L130,210" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arg)"/><rect x="85.14699999999996" y="185.775" width="389.7060000000001" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="280.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">access, id and refresh tokens (access token 60 min)</text><path d="M130,247 h60 v24 h-58" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><text x="200" y="263" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#334155" text-anchor="start">keep tokens in memory + sessionStorage</text><path d="M130,310 L750,310" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="219.226" y="285.775" width="441.548" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="440.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">GET /api/v1/expenses  Authorization: Bearer &lt;access token&gt;</text><path d="M750,360 L430,360" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arg)"/><rect x="391.44399999999996" y="335.775" width="397.112" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="590.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">verify signature via JWKS, issuer, client_id, expiry</text><path d="M750,410 L1070,410" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="763.286" y="385.775" width="293.42800000000005" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="910.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">invoke route group function (event v2)</text><path d="M1070,447 h60 v24 h-58" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/><text x="1140" y="463" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.8" font-weight="400" fill="#334155" text-anchor="start">re-verify JWT (RS256, token_use=access) → user id = sub</text><path d="M1070,510 L1360,510" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1020.1469999999999" y="485.775" width="389.7060000000001" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="1215.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">Query PK = USER#&lt;sub&gt; (partition of this user only)</text><path d="M1360,560 L1070,560" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arg)"/><rect x="1142.346" y="535.775" width="145.308" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="1215.0" y="552.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">items of this user</text><path d="M1070,615 L130,615" fill="none" stroke="#059669" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arg)"/><rect x="431.068" y="590.775" width="337.86400000000003" height="23.225" rx="5" fill="#ffffff" fill-opacity="0.94"/><text x="600.0" y="607.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="400" fill="#334155" text-anchor="middle">200 JSON (or 401 / 404 for other users&#x27; ids)</text><text x="40" y="670" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="start">Local mode (implemented &amp; tested): FastAPI /auth/login verifies a scrypt hash and issues an HS256 JWT; the same user-scoping applies.</text><text x="40" y="695" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="400" fill="#5b6560" text-anchor="start">Defence in depth: the gateway rejects invalid tokens before Lambda runs, and the backend verifies the token again.</text><text x="40" y="730" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.4" font-weight="600" fill="#92400e" text-anchor="start">Verified live (AUTH-01–07, SEC-01–09). The backend also calls Cognito GetUser to reject tokens revoked by sign-out (15 s cache).</text></svg>